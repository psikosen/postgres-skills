name: ci
on:
  pull_request:
  push:
    branches: [geo, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run toolkit test suite
        run: |
          chmod +x install.sh bump.sh tests/run-tests.sh skills/*/scripts/*.sh hooks/*.sh
          ./tests/run-tests.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every script
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          # SC1090/SC1091: dynamic `source ~/.claude/pg.env` is the design.
          shellcheck -e SC1090,SC1091 install.sh bump.sh tests/run-tests.sh \
            skills/*/scripts/*.sh hooks/*.sh
